<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do Dia</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            text-align: center;
        }
        main {
            height: 400px;
            width: 600px;
            margin: auto;
            background-color: rgb(189, 189, 189);
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }
        main p {
            color: black;
            padding-top: 20px;
            font-style: normal;
        }
        main img {
            width: 300px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 15px;
        }
        p {
            font-style: italic;
            color: blue;
        }
    </style>
</head>
<body>
    <h1>
        Hora do Dia
    </h1>
    <main>
        <p id="txthr">
            
        </p>
        <img src="" alt="Imagem alternável">
    </main>
    <p>
        RealTime
    </p>
    <script>
        var hora = new Date().getHours()
        // var hora = 18
        var txt = window.document.getElementById('txthr')
        var fundo = window.document.querySelector('body')
        var imagem = window.document.querySelector('main img')
        document.addEventListener('DOMContentLoaded', horario)
        function horario() {
            txt.innerText = `Agora são ${hora} horas.`
            if (hora < 6 || hora >= 18) {
                fundo.style.backgroundColor = 'rgb(50, 50, 50)'
                imagem.src = 'noite.jpg'
                window.document.querySelector('body > p').style.color = 'white'
            } else if (hora < 12) {
                fundo.style.backgroundColor = 'rgb(111, 195, 250)'
                imagem.src = 'amanhecer.jpg'
            } else {
                fundo.style.backgroundColor = 'rgb(255, 169, 72)'
                imagem.src = 'tarde.jpg'
            }
        }
    </script>
</body>
</html>
