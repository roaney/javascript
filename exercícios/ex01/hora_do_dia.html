<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do Dia</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background-color: rgb(111, 195, 250);
            text-align: center;
        }
        main {
            height: 400px;
            width: 600px;
            margin: auto;
            background-color: rgb(182, 182, 182);
            box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }
        main p {
            color: black;
            padding-top: 20px;
            font-style: normal;
        }
        main img {
            width: 300px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 15px;
        }
        p {
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>
        Hora do Dia
    </h1>
    <main>
        <p>
            Agora são 10 horas.
        </p>
        <img src="amanhecer.jpg" alt="foto do amanhecer">
    </main>
    <p>
        RealTime
    </p>
</body>
</html>
