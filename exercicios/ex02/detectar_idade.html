<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>
        Verificador de Idade
    </h1>
    <main>
        <section id="um">
            <div>
                <label for="ano">Ano de nascimento:</label>
                <input type="number" name="ano" id="ano">
            </div>
            <div>
                <label for="masc, fem">Sexo:</label>
                <input type="radio" name="sex" id="masc" value="homem">
                <label for="masc">Masculino</label>
                <input type="radio" name="sex" id="fem" value="mulher">
                <label for="fem">Feminino</label>
            </div>
            <div>
                <input type="submit" value="Verificar" onclick="verificar_idade()">
            </div>
        </section>
        <section id="dois">
            <p id="txtidade">
                Preencha os dados acima e veja o resultado.
            </p>
        </section>
    </main>
    <p>
        &copy; RealTime
    </p>
    <script src="script.js">
        
    </script>
</body>
</html>
