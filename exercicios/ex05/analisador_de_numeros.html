            <p id="txtvalores">
                
            </p>

                <input type="button" value="Finalizar" id="finalizar" class="botoes">

        </div>
        <div id="dois" class="fundodivs">
            <p>
                Veja a análise aqui.
            </p>
            <p id="txtresultado">
                
            </p>
        </div>

        &copy; RealTime
