<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(87, 103, 155);
            text-align: center;
        }
        #area {
            background-color: rgb(145, 145, 145);
            height: 200px;
            width: 200px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div>
        <h1 id="area" onclick="clicar()">
            Interaja...
        </h1>
    </div>
    <script>
        function clicar() {
            var a = window.document.getElementById('area')
            a.innerText = 'Clicou!'
        }
    </script>
</body>
</html>
