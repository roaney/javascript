<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-color: rgb(49, 49, 49);
            color: white;
        }
        div {
            background-color: transparent;
            border-radius: 10px;
            box-shadow: 0px 0px 10px 0px black;
        }
        #res {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>
        Sistema de Multas
    </h1>
    <div>
        <label for="txtvel">Velocidade do carro:</label>
        <input type="number" name="txtvel" id="txtvel" placeholder="Km/h">
        <input type="button" value="Verificar" onclick="calcular()">
    </div>
    <div id="res">

    </div>
    <script>
        function calcular() {
            var vel = Number(window.document.getElementById('txtvel').value)
            if (vel > 60) {
                window.document.getElementById('res').innerText = 'Você ultrapassou o limite de velocidade. MULTADO!'
            } else {
                window.document.getElementById('res').innerText = 'A velocidade está dentro do limite.'
            }
        }
    </script>
</body>
</html>
