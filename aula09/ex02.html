<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos DOM</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(161, 114, 204);
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p id="interno">Aprendendo a usar o <strong>DOM</strong> em JavaScript</p>
    <div id="msg">Clique em mim</div>
    <script>
        const itens = window.document.querySelectorAll('p')
        itens.forEach(item => {
            item.style.backgroundColor = 'yellow'
            item.style.borderRadius = '5px'
        })
        const interno = window.document.querySelectorAll('#interno strong')
        interno.forEach(item => {
            item.style.color = 'red'
        })
    </script>
</body>
</html>
