<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos DOM</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(161, 114, 204);
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript</p>
    <div id="msg">Clique em mim</div>
    <script>
        var p1 = window.document.getElementsByTagName('p')[0]
        var p2 = window.document.getElementsByTagName('p')[1]
        // var d = window.document.getElementById('msg')
        window.document.write(p2.innerText)
        window.document.write(p2.innerHTML)
        p1.style.color = 'orange'
        /*
        d.style.backgroundColor = 'white'
        d.innerText = 'Olá' // window.document.getElementById('msg').innerText = 'Olá'
        */
        /*
        var d = window.document.getElementsByName('msg')[0]
        d.innerText = 'Olá'
        */
        var d = window.document.querySelector('div#msg')
        d.style.color = 'white'
    </script>
</body>
</html>
